<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loja — Artigos de Quebra</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
<div class="announce" id="announce"></div>
<header class="header" id="header"></header>
<main class="container">
  <div class="page-head"><h1 class="section-title">Loja</h1></div>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="search" id="search" placeholder="Buscar produtos" aria-label="Buscar produtos">
      <select id="sort" aria-label="Ordenar"><option value="relevancia">Relevância</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select>
    </div>
  </div>
  <p id="count" style="color:var(--muted);margin-bottom:18px"></p>
  <div class="grid" id="list" style="margin-bottom:90px"></div>
</main>
<footer class="footer" id="footer"></footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
